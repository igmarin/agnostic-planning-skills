name: rs-guard PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: rs-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Generate PR diff
        id: diff
        run: |
          git diff \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            --unified=5 > pr.diff

          if [ ! -s pr.diff ]; then
            echo "Empty diff — nothing to review."
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Make rs-guard executable
        if: steps.diff.outputs.empty == 'false'
        run: chmod +x bin/rs-guard-linux-x64

      - name: Run rs-guard review
        if: steps.diff.outputs.empty == 'false'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bin/rs-guard-linux-x64 \
            --diff-file pr.diff \
            --prompt-file .github/review-prompt.md \
            --provider deepseek
